<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d2a26"/></marker>
<marker id="u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cff"/></marker></defs>
<rect width="480" height="330" fill="#fff"/>
<text x="240" y="20" font-size="13" text-anchor="middle" fill="#2d2a26" font-weight="700">下照式：每印一層，機器就把模型往上拉，從盤底「撕」起來</text><rect x="40" y="52" width="160" height="10" fill="#8f969c" stroke="#2d2a26" stroke-width="1.2" rx="0" /><line x1="120" y1="48" x2="120" y2="30" stroke="#2d2a26" stroke-width="2.5" marker-end="url(#a)"/><text x="130" y="42" font-size="12" text-anchor="start" fill="#2d2a26">往上拉</text><line x1="52" y1="62" x2="52" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><line x1="69" y1="62" x2="69" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><line x1="86" y1="62" x2="86" y2="102.0" stroke="#b8b2aa" stroke-width="2.5"/><line x1="86" y1="114.0" x2="86" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><text x="86" y="113.0" font-size="13" text-anchor="middle" fill="#d63b3b" font-weight="700">✗</text><line x1="103" y1="62" x2="103" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><line x1="120" y1="62" x2="120" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><line x1="137" y1="62" x2="137" y2="102.0" stroke="#b8b2aa" stroke-width="2.5"/><line x1="137" y1="114.0" x2="137" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><text x="137" y="113.0" font-size="13" text-anchor="middle" fill="#d63b3b" font-weight="700">✗</text><line x1="154" y1="62" x2="154" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><line x1="171" y1="62" x2="171" y2="102.0" stroke="#b8b2aa" stroke-width="2.5"/><line x1="171" y1="114.0" x2="171" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><text x="171" y="113.0" font-size="13" text-anchor="middle" fill="#d63b3b" font-weight="700">✗</text><line x1="188" y1="62" x2="188" y2="154" stroke="#b8b2aa" stroke-width="2.5"/><rect x="45" y="154" width="150" height="50" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.2" rx="0" /><rect x="20" y="170" width="200" height="40" fill="#f4c25a" stroke="#2d2a26" stroke-width="1.5" rx="0" fill-opacity=".55"/><line x1="45" y1="205" x2="195" y2="205" stroke="#d63b3b" stroke-width="4"/><text x="120" y="226" font-size="12" text-anchor="middle" fill="#d63b3b">整片黏在盤底</text><line x1="50" y1="252" x2="50" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="85" y1="252" x2="85" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="120" y1="252" x2="120" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="155" y1="252" x2="155" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="190" y1="252" x2="190" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><text x="120" y="278" font-size="15" text-anchor="middle" fill="#d63b3b" font-weight="700">B：大面平放</text><text x="120" y="298" font-size="12" text-anchor="middle" fill="#2d2a26">每層都是整片 30×30</text><text x="120" y="316" font-size="12" text-anchor="middle" fill="#2d2a26">撕很用力 → 支撐被扯斷、掉下來</text><line x1="240" y1="40" x2="240" y2="320" stroke="#b8b2aa" stroke-width="1" stroke-dasharray="4 4"/><rect x="280" y="52" width="160" height="10" fill="#8f969c" stroke="#2d2a26" stroke-width="1.2" rx="0" /><line x1="360" y1="48" x2="360" y2="30" stroke="#2d2a26" stroke-width="2.5" marker-end="url(#a)"/><text x="370" y="42" font-size="12" text-anchor="start" fill="#2d2a26">往上拉</text><line x1="292" y1="62" x2="292" y2="94.36792452830188" stroke="#b8b2aa" stroke-width="2.5"/><line x1="306" y1="62" x2="306" y2="104.27358490566039" stroke="#b8b2aa" stroke-width="2.5"/><line x1="320" y1="62" x2="320" y2="114.17924528301887" stroke="#b8b2aa" stroke-width="2.5"/><line x1="334" y1="62" x2="334" y2="124.08490566037736" stroke="#b8b2aa" stroke-width="2.5"/><line x1="348" y1="62" x2="348" y2="133.99056603773585" stroke="#b8b2aa" stroke-width="2.5"/><line x1="362" y1="62" x2="362" y2="143.89622641509433" stroke="#b8b2aa" stroke-width="2.5"/><line x1="376" y1="62" x2="376" y2="153.80188679245282" stroke="#b8b2aa" stroke-width="2.5"/><path d="M360 204L254 129L283 88L389 163Z" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.2"/><rect x="246" y="170" width="226" height="40" fill="#f4c25a" stroke="#2d2a26" stroke-width="1.5" rx="0" fill-opacity=".55"/><line x1="350" y1="205" x2="370" y2="205" stroke="#d63b3b" stroke-width="4"/><text x="372" y="226" font-size="12" text-anchor="middle" fill="#d63b3b">只黏一小條</text><line x1="290" y1="252" x2="290" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="325" y1="252" x2="325" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="360" y1="252" x2="360" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="395" y1="252" x2="395" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><line x1="430" y1="252" x2="430" y2="232" stroke="#7b5cff" stroke-width="1.5" marker-end="url(#u)"/><text x="360" y="278" font-size="15" text-anchor="middle" fill="#2f9e5b" font-weight="700">A、C、D：立起或斜放</text><text x="360" y="298" font-size="12" text-anchor="middle" fill="#2d2a26">每層面積小</text><text x="360" y="316" font-size="12" text-anchor="middle" fill="#2d2a26">好撕 → 支撐不會斷</text>
</svg>
