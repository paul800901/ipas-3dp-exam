<text x="120" y="22" font-size="15" text-anchor="middle" fill="#2d2a26" font-weight="700">近端送料（Direct）</text><line x1="120" y1="34" x2="120" y2="62" stroke="#d9673b" stroke-width="3"/><rect x="92" y="62" width="56" height="40" fill="#ddd" stroke="#2d2a26" stroke-width="1.5" rx="4" /><text x="120" y="87" font-size="13" text-anchor="middle" fill="#2d2a26">馬達</text><rect x="105.0" y="102" width="30" height="22" fill="#e04b3a" stroke="#2d2a26" stroke-width="1.2" rx="3" /><path d="M111 124H129L123 136H117Z" fill="#c9a227" stroke="#2d2a26" stroke-width="1.2"/><text x="120" y="172" font-size="13" text-anchor="middle" fill="#2d2a26">馬達就在噴頭上</text><text x="120" y="192" font-size="13" text-anchor="middle" fill="#2f9e5b">✓ 回抽準、推力好</text><text x="120" y="212" font-size="13" text-anchor="middle" fill="#2f9e5b">✓ 軟料 TPU 推得動</text><text x="120" y="232" font-size="13" text-anchor="middle" fill="#7a7166">△ 噴頭重、慣性大</text><line x1="240" y1="14" x2="240" y2="236" stroke="#b8b2aa" stroke-width="1" stroke-dasharray="4 4"/><text x="360" y="22" font-size="15" text-anchor="middle" fill="#2d2a26" font-weight="700">遠端送料（Bowden）</text><rect x="262" y="46" width="48" height="40" fill="#ddd" stroke="#2d2a26" stroke-width="1.5" rx="4" /><text x="286" y="71" font-size="13" text-anchor="middle" fill="#2d2a26">馬達</text><text x="286" y="104" font-size="12" text-anchor="middle" fill="#7a7166">（裝在機架上）</text><path d="M310 66C380 40 420 60 410 102" fill="none" stroke="#9cc3e6" stroke-width="7"/><path d="M310 66C380 40 420 60 410 102" fill="none" stroke="#d9673b" stroke-width="2"/><text x="392" y="46" font-size="12" text-anchor="start" fill="#2d2a26">長管子</text><rect x="398.0" y="102" width="24" height="22" fill="#e04b3a" stroke="#2d2a26" stroke-width="1.2" rx="3" /><path d="M401 124H419L413 136H407Z" fill="#c9a227" stroke="#2d2a26" stroke-width="1.2"/><text x="360" y="172" font-size="13" text-anchor="middle" fill="#2d2a26">線穿過長管才到噴頭</text><text x="360" y="192" font-size="13" text-anchor="middle" fill="#2f