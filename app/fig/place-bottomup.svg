<text x="240" y="20" font-size="13" text-anchor="middle" fill="#7a7166">下照式光固化：切片軟體裡的擺法（平台在下，往上長）</text><rect x="20" y="150" width="120" height="6" fill="#8f969c" stroke="#2d2a26" stroke-width="1" rx="0" /><rect x="180" y="150" width="120" height="6" fill="#8f969c" stroke="#2d2a26" stroke-width="1" rx="0" /><rect x="340" y="150" width="120" height="6" fill="#8f969c" stroke="#2d2a26" stroke-width="1" rx="0" /><path d="M40 150V80H120V150H106V94H54V150Z" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.3"/><text x="80" y="128" font-size="11" text-anchor="middle" fill="#fff">封住</text><text x="80" y="182" font-size="16" text-anchor="middle" fill="#d63b3b" font-weight="700">✗ 不好</text><text x="80" y="202" font-size="12" text-anchor="middle" fill="#2d2a26">開口朝下</text><text x="80" y="220" font-size="12" text-anchor="middle" fill="#d63b3b">吸盤效應，會扯壞</text><path d="M200 150V80H214V136H266V80H280V150Z" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.3"/><text x="240" y="182" font-size="16" text-anchor="middle" fill="#2f9e5b" font-weight="700">✓ 好</text><text x="240" y="202" font-size="12" text-anchor="middle" fill="#2d2a26">開口朝上</text><text x="240" y="220" font-size="12" text-anchor="middle" fill="#2d2a26">實心底先印</text><path d="M362 126L432 60L442 70L372 136Z" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.3"/><line x1="372" y1="134" x2="372" y2="150" stroke="#b8b2aa" stroke-width="1.5"/><line x1="388" y1="119" x2="388" y2="150" stroke="#b8b2aa" stroke-width="1.5"/><line x1="404" y1="104" x2="404" y2="150" stroke="#b8b2aa" stroke-width="1.5"/><line x1="420" y1="89" x2="420" y2="150" stroke="#b8b2aa" stroke-width="1.5"/><line x1="436" y1="74" x2="436" y2="150" stroke="#b8b2aa" stroke-width="1.5"/><text x="400" y="182" font-size="16" text-anchor="middle" fill="#2f9e5b" font-weight="700">✓ 好</text><text x="400" y="202" font-size="12" text-anchor="middle" fill="#2d2a26">大平面斜放</text><text x="400" y="220" font-size="12" text-anchor="middle" fill="#2d2a26">每層面積小、好撕開</text>
