<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d2a26"/></marker>
<marker id="u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cff"/></marker></defs>
<rect width="480" height="270" fill="#fff"/>
<text x="120" y="20" font-size="15" text-anchor="middle" fill="#2d2a26" font-weight="700">上照式（Top-down）</text><line x1="90" y1="30" x2="90" y2="66" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><line x1="120" y1="30" x2="120" y2="66" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><line x1="150" y1="30" x2="150" y2="66" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><rect x="40" y="70" width="160" height="140" fill="#f4c25a" stroke="#2d2a26" stroke-width="1.5" rx="0" /><rect x="80" y="98" width="80" height="40" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.2" rx="0" /><rect x="70" y="138" width="100" height="8" fill="#8f969c" stroke="#2d2a26" stroke-width="1" rx="0" /><line x1="120" y1="146" x2="120" y2="200" stroke="#2d2a26" stroke-width="1.5"/><line x1="186" y1="110" x2="186" y2="150" stroke="#2d2a26" stroke-width="2" marker-end="url(#a)"/><text x="120" y="232" font-size="13" text-anchor="middle" fill="#2d2a26">光從上照，平台往下沉</text><text x="120" y="252" font-size="12" text-anchor="middle" fill="#7a7166">槽要很深；不用撕開，適合大件</text><line x1="240" y1="10" x2="240" y2="260" stroke="#b8b2aa" stroke-width="1" stroke-dasharray="4 4"/><text x="360" y="20" font-size="15" text-anchor="middle" fill="#2d2a26" font-weight="700">下照式（Bottom-up）</text><rect x="300" y="40" width="120" height="10" fill="#8f969c" stroke="#2d2a26" stroke-width="1.2" rx="0" /><line x1="360" y1="28" x2="360" y2="40" stroke="#2d2a26" stroke-width="1.5"/><rect x="320" y="50" width="80" height="110" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.2" rx="0" /><rect x="290" y="150" width="140" height="26" fill="#f4c25a" stroke="#2d2a26" stroke-width="1.5" rx="0" /><rect x="320" y="150" width="80" height="10" fill="#4f86e8" stroke="#2d2a26" stroke-width="1.2" rx="0" /><line x1="330" y1="206" x2="330" y2="180" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><line x1="360" y1="206" x2="360" y2="180" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><line x1="390" y1="206" x2="390" y2="180" stroke="#7b5cff" stroke-width="1.6" marker-end="url(#u)"/><line x1="438" y1="120" x2="438" y2="70" stroke="#2d2a26" stroke-width="2" marker-end="url(#a)"/><text x="436" y="140" font-size="12" text-anchor="end" fill="#2d2a26">撕開</text><text x="360" y="232" font-size="13" text-anchor="middle" fill="#2d2a26">光從槽底往上照，模型倒掛</text><text x="360" y="252" font-size="12" text-anchor="middle" fill="#7a7166">每層都要從槽底撕開（拉拔力）</text>
</svg>
